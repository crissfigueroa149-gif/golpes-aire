plugins { id 'com.android.application' }
android {
    namespace 'cl.medidorsalto'
    compileSdk 34
    defaultConfig {
        applicationId 'cl.medidorsalto'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.1'
    }
    signingConfigs { fija { storeFile file('medidor.jks'); storePassword 'medidor123'; keyAlias 'medidor'; keyPassword 'medidor123' } }
    buildTypes { debug { signingConfig signingConfigs.fija } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
