name: Compilar APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'salto/index.html', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copiar la página a la app
        run: mkdir -p android/app/src/main/assets && cp salto/index.html android/app/src/main/assets/index.html
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MedidorSalto.apk
      - uses: actions/upload-artifact@v4
        with: { name: MedidorSalto-apk, path: MedidorSalto.apk }
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Medidor de Salto (APK)
          files: MedidorSalto.apk
